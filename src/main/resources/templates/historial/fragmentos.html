<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}">
        <meta charset="UTF-8"/>
        <title>Siamese</title>
    </head>
    <body>
        <section th:fragment="historial">
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Razón</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="c: ${citas}">
                        <td th:text="${c.id}"></td>
                        <td th:text="${c.razon}"></td>
                        <td th:text="${c.fecha}"></td>
                        <td th:text="${c.hora}"></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </body>
</html>
