<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <title>Siamese</title>
        <link rel="icon" type="image/png" sizes="16x16" href="/fav/favicon-16x16.png"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/fav/favicon-32x32.png"/>

        <link th:href="@{/webjars/font-awesome/6.5.1/css/all.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet"/>
        <link href="/css/estilos.css" rel="stylesheet" type="text/css"/>

        <style>
            .btn-primary {
                background-color: var(--color-sidebar) !important;
                border-color: var(--color-sidebar-dark) !important;
            }
            .btn-primary:hover {
                background-color: var(--color-sidebar-dark) !important;
            }

            .btn-registro {
                background-color: #6F4E37 !important;
                border-color: #5D4037 !important;
                color: white !important;
            }

            .btn-registro:hover {
                background-color: #5D4037 !important; /* Un poco más oscuro al pasar el mouse */
            }




            .btn-warning {
                background-color: var(--color-accent) !important;
                border-color: var(--color-accent) !important;
                color: white !important;
            }
            .navbar {
                background-color: var(--color-sidebar) !important;
            }
            .navbar-brand, .nav-link {
                color: white !important;
            }
            .nav-link:hover {
                color: var(--color-bg) !important;
            }
            #main-header {
                background-color: var(--color-sidebar-dark) !important;
            }
            .modal-header {
                background-color: var(--color-sidebar) !important;
                color: white !important;
            }
            .modal-content {
                border-radius: var(--radius-card) !important;
            }
            .table thead {
                background-color: var(--color-sidebar) !important;
                color: white !important;
            }
            .table-striped tbody tr:nth-of-type(odd) {
                background-color: #FAF4ED !important;
            }
            .table tbody tr:hover {
                background-color: #F0E8DF !important;
            }
            .card {
                border-radius: var(--radius-card) !important;
                border: none !important;
                box-shadow: 0 2px 12px rgba(0,0,0,0.07) !important;
            }
            .card-header {
                background-color: var(--color-bg) !important;
                border-bottom: 1.5px solid var(--color-divider) !important;
                font-family: var(--font-display) !important;
            }
            .toast-header.bg-success {
                background-color: var(--color-sidebar) !important;
            }
            .toast-header.bg-danger {
                background-color: #C0392B !important;
            }
            footer.bg-dark {
                background-color: var(--color-sidebar-dark) !important;
            }
        </style>

        <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
        <script th:src="@{/js/rutinas.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
    </head>

    <body>
        <header th:fragment="header" class="header">
            <nav class="navbar navbar-expand-sm p-0">
                <div class="container">
                    <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
                    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">

                    
                            <!-- ── Menú derecho (no autenticado): Login + Registrarse ── -->
                            <ul class="navbar-nav" sec:authorize="!isAuthenticated()">
                                <li class="nav-item my-auto px-2">
                                    <a class="nav-link" th:href="@{/login}">
                                        <i class="fas fa-sign-in-alt"></i>
                                        <span class="ms-1">Login</span>
                                    </a>
                                </li>
                                <li class="nav-item my-auto px-2">
                                    <a class="btn btn-registro btn-sm" th:href="@{/registro/nuevo}">
                                        <i class="fas fa-user-plus me-1"></i>[[#{plantilla.registrarse}]]
                                    </a>
                                </li>
                            </ul>

                            <!-- ── Menú derecho (autenticado): Usuario + Logout ── -->
                            <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                                <li class="nav-item my-auto px-2">
                                    <a class="nav-link">
                                        <img th:if="${session.imagenUsuario != null}"
                                             th:src="@{${session.imagenUsuario}}"
                                             height="40" style="border-radius:50%;"/>
                                        <i th:if="${session.imagenUsuario == null}"
                                           class="fas fa-user"></i>
                                        <span sec:authentication="name" class="ms-1"></span>
                                    </a>
                                </li>
                                <li class="nav-item my-auto">
                                    <form method="post" th:action="@{/logout}">
                                        <button class="btn nav-link" type="submit">
                                            <i class="fas fa-sign-out-alt"></i>
                                            <span class="ms-1">Logout</span>
                                        </button>
                                    </form>
                                </li>
                            </ul>

                    </div>
                </div>
            </nav>
        </header>

        <!-- ── Toast ── -->
        <section th:fragment="mostrarToast">
            <div aria-live="polite" aria-atomic="true"
                 class="position-fixed top-50 start-50 translate-middle"
                 style="z-index: 1080;">
                <div th:if="${error}" class="toast show" role="alert" data-bs-delay="3000">
                    <div class="toast-header text-white bg-danger">
                        <i class="fa-solid fa-bomb"></i>
                        <strong class="me-auto"> [[#{error}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${error}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
                <div th:if="${todoOk}" class="toast show" role="status" data-bs-delay="3000">
                    <div class="toast-header text-white bg-success">
                        <i class="fa-solid fa-square-check"></i>
                        <strong class="me-auto"> [[#{atencion}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${todoOk}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm"
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
            </div>
            <script>
                document.addEventListener("DOMContentLoaded", function () {
                    document.querySelectorAll('.toast').forEach(function (toastEl) {
                        new bootstrap.Toast(toastEl, {delay: 3000}).show();
                    });
                });
            </script>
        </section>

        <footer th:fragment="footer" class="p-2 mt-5 bg-dark text-white">
            <p class="lead text-center">Siamese Store &copy; 2026</p>
        </footer>

    </body>
</html>
