<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head>
        <title>Veterinaria Siamese Cal</title>
        <meta charset="UTF-8"/>
        <link href="/css/estilos.css" rel="stylesheet" type="text/css"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
        <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
        <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    </head>
    <body>
        <header th:fragment="header" class="header">
            <div class="app-wrapper">
                <aside class="sidebar">

                    <div class="sidebar-section" style="margin-top: 0.4rem;">

                        <h1 class="menu-titleCitas">Citas</h1>
                        <ul class="menu-listCitas">
                            <li><a href="/crearCita" class="btn-citas">Crear cita</a></li>
                            <li><a href="/cancelarCita" class="btn-citas">Cancelar Cita</a></li>
                            <li><a href="/index" class="btn-citas">Regresar</a></li>
                            <li><a href="/consultarCita" class="btn-citas">Consultar Cita</a></li>
                        </ul>
                    </div>
                </aside>

                <div class="main-content">
                    <header class="topbar">
                        <a href="/perfil">
                            <img src="/img/usuario.png" alt="" width="35"/>
                        </a>
                    </header>
                    <table class="table table-bordered">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Dueño</th>
                                <th>Razón de la cita</th>
                                <th>Nombre</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c: ${citas}">
                                <td th:text="${c.id}"></td>
                                <td th:text="${c.dueño}"></td>
                                <td th:text="${c.nombreMascota}"></td>
                                <td th:text="${c.razon}"></td>
                                <td th:text="${c.fecha}"></td>
                                <td th:text="${c.horaCita}"></td>
                                <td>
                                    <form th:action="@{/eliminarCitaConsultas}" method="post">
                                        <input type="hidden" name="id" th:value="${c.id}"/>
                                            <button type="submit" class="btn-danger">
                                                Eliminar
                                            </button>
                                    </form>
                                </td>    
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </header>
        <footer style="margin-top: auto; padding-top: 2rem;
                font-size: 0.8rem; color: var(--color-text-muted); text-align: center;">
            Todos los Derechos Reservados &copy; Veterinaria
        </footer>
    </body>
</html>
